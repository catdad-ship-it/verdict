name: Supabase keep-alive

# Supabase pauses free-tier projects after 7 days without activity. Fly's
# health check doesn't count — /api/health never touches the DB — so a quiet
# week away from the app is enough to take it down.
#
# This used to be an anon SELECT twice a week. Every run passed and the project
# paused anyway (Oct 2026): an RLS-filtered read evidently isn't "activity".
# Now it's a daily write — the keepalive_ping() RPC bumps a timestamp row (see
# supabase/migrations/20261013_keepalive_heartbeat.sql).
#
# The run fails unless the RPC hands back a timestamp, so a paused project,
# bad key, or missing function all fail it — and GitHub emails about failures.
#
# Note: GitHub disables scheduled workflows in public repos after 60 days with
# no commits. If that happens it emails too — re-enable from the Actions tab.

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # URL and anon key come from fly.toml's build args (publishable, already
      # committed) so there's no separate secret to keep in sync.
      - name: Write heartbeat
        run: |
          url=$(grep -oP 'NEXT_PUBLIC_SUPABASE_URL = "\K[^"]+' fly.toml)
          key=$(grep -oP 'NEXT_PUBLIC_SUPABASE_ANON_KEY = "\K[^"]+' fly.toml)
          out=$(curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 30 --retry-all-errors \
            -X POST "$url/rest/v1/rpc/keepalive_ping" \
            -H "apikey: $key" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "$out"
          [[ "$out" == '"20'* ]] || { echo "::error::Expected a timestamp back from keepalive_ping"; exit 1; }
